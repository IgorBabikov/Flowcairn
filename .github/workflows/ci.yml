name: Проверки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Зависимости без lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Типы
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit и integration tests без внешнего AI
        run: npm test
      - name: Сборка интерфейса
        run: npm run build
      - name: Собранный интерфейс совпадает с исходниками
        run: |
          git ls-files --error-unmatch tools/ai-graph-viewer/dist/app.js tools/ai-graph-viewer/dist/app.css tools/ai-graph-viewer/dist/index.html
          git diff --exit-code -- tools/ai-graph-viewer/dist
      - name: Chromium для проверки интерфейса
        run: npx --no-install playwright install --with-deps chromium
      - name: Браузерные сценарии без внешнего AI
        run: npm run test:ui
      - name: Проверка публичного состава
        run: npm run check:public
      - name: Состав устанавливаемого архива
        run: npm run check:package
  native-windows:
    name: Native Windows / Node 22.13.1
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLOWCAIRN_REQUIRE_NATIVE_WINDOWS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Зависимости без lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Типы
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Native Windows filesystem, processes, setup and runner
        run: node --test scripts/ai-graph/native-windows-filesystem.test.mjs scripts/ai-graph/host-process.test.mjs scripts/ai-graph/windows-job.test.mjs tests/install-platform.test.mjs tests/native-windows.test.mjs
      - name: Сборка интерфейса
        run: npm run build
