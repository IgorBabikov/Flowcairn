name: Проверки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Зависимости без lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Типы
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit и integration tests без внешнего AI
        run: npm test
      - name: Сборка интерфейса
        run: npm run build
      - name: Chromium для проверки интерфейса
        run: npx --no-install playwright install --with-deps chromium
      - name: Браузерные сценарии без внешнего AI
        run: npm run test:ui
      - name: Проверка публичного состава
        run: npm run check:public
      - name: Состав устанавливаемого архива
        run: npm run check:package
