<rect x="0" y="153" width="280" height="91" rx="14" fill="#263b43" stroke="#67d2d0" stroke-width="2"/><circle cx="22" cy="178" r="5" fill="#7ee4dc"/><text x="38" y="183" fill="#8be5dc" font-size="13" letter-spacing="1.2">ВЫПОЛНЯЕТСЯ</text><text x="20" y="215" fill="#fff" font-size="21" font-weight="700">Изменение кода</text>
