<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Flowcairn — от задачи к проверенному результату</title>
  <desc id="desc">Иллюстрация задачи с отдельными требованиями: для каждого видны выполненная работа и статус проверки.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f7ff"/>
      <stop offset="1" stop-color="#ecf7f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6255dd"/>
      <stop offset="1" stop-color="#319b96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#39416f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#background)"/>
  <circle cx="1160" cy="58" r="188" fill="#e4e4fc" opacity=".42"/>
  <circle cx="95" cy="421" r="145" fill="#d8f0ea" opacity=".52"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(64 53)">
      <rect width="38" height="38" rx="12" fill="#6255dd"/>
      <path d="M11 22l7-8 7 8 6-8" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="29" fill="#202744" font-size="25" font-weight="750" letter-spacing="-.7">Flowcairn</text>
      <text x="0" y="118" fill="#202744" font-size="46" font-weight="750" letter-spacing="-1.8">Дайте задачу.</text>
      <text x="0" y="171" fill="#202744" font-size="46" font-weight="750" letter-spacing="-1.8">Увидьте результат.</text>
      <rect x="0" y="193" width="420" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="0" y="245" fill="#48536d" font-size="21">План, исполнение и проверки</text>
      <text x="0" y="276" fill="#48536d" font-size="21">для каждого обязательного требования.</text>
      <g transform="translate(0 320)">
        <rect width="245" height="38" rx="19" fill="#e9e7fd"/>
        <circle cx="20" cy="19" r="5" fill="#6255dd"/>
        <text x="35" y="25" fill="#4c40b4" font-size="16" font-weight="650">От цели до проверки</text>
      </g>
    </g>
    <g transform="translate(655 47)" filter="url(#shadow)">
      <rect width="563" height="346" rx="22" fill="white" stroke="#dbe0ef"/>
      <rect x="25" y="23" width="80" height="28" rx="14" fill="#e9e7fd"/>
      <text x="42" y="43" fill="#5548c8" font-size="13" font-weight="700">ЗАДАЧА</text>
      <text x="25" y="88" fill="#202744" font-size="25" font-weight="700">Форма регистрации</text>
      <text x="25" y="117" fill="#69738b" font-size="15">2 из 3 требований подтверждены</text>
      <rect x="25" y="136" width="513" height="7" rx="3.5" fill="#edf0f7"/>
      <rect x="25" y="136" width="342" height="7" rx="3.5" fill="url(#accent)"/>
      <g font-size="16">
        <circle cx="40" cy="180" r="12" fill="#e0f5ee"/><path d="M35 180l4 4 7-8" fill="none" stroke="#158363" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="63" y="186" fill="#28344e" font-weight="600">Проверка email</text>
        <text x="430" y="186" fill="#158363" font-size="13" font-weight="650">Проверено</text>
        <path d="M25 202h513" stroke="#edf0f5"/>
        <circle cx="40" cy="227" r="12" fill="#e0f5ee"/><path d="M35 227l4 4 7-8" fill="none" stroke="#158363" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="63" y="233" fill="#28344e" font-weight="600">Ошибки рядом с полями</text>
        <text x="430" y="233" fill="#158363" font-size="13" font-weight="650">Проверено</text>
        <path d="M25 249h513" stroke="#edf0f5"/>
        <circle cx="40" cy="274" r="12" fill="#fff0d6"/><path d="M40 268v7m0 4h.01" fill="none" stroke="#a97820" stroke-width="2.5" stroke-linecap="round"/>
        <text x="63" y="280" fill="#28344e" font-weight="600">Повторная отправка</text>
        <text x="399" y="280" fill="#a97820" font-size="13" font-weight="650">Нужна проверка</text>
      </g>
      <rect x="25" y="302" width="513" height="1" fill="#edf0f5"/>
      <text x="25" y="327" fill="#758098" font-size="13">Статус задачи зависит от всех требований</text>
    </g>
  </g>
</svg>
