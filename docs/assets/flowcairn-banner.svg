<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Flowcairn — от задачи до проверенного результата</title>
<desc id="desc">Опишите задачу. Проверьте план. Управляйте AI-разработкой через живой граф.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e4f3e8"/><stop offset="1" stop-color="#f5f7df"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#356946" opacity=".16"/></pattern></defs>
<rect width="1280" height="480" rx="28" fill="url(#bg)"/><rect width="1280" height="480" rx="28" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="58" y="52" width="52" height="52" rx="16" fill="#305b40"/>
<g fill="#d9f5be"><rect x="69" y="72" width="7" height="14" rx="3.5"/><rect x="81" y="64" width="7" height="30" rx="3.5"/><rect x="93" y="69" width="7" height="20" rx="3.5"/></g>
<text x="126" y="90" fill="#173d2a" font-size="40" font-weight="700" letter-spacing="-1">Flowcairn</text>
<text x="60" y="167" fill="#173d2a" font-size="43" font-weight="700" letter-spacing="-1">AI пишет код.</text>
<text x="60" y="221" fill="#487b39" font-size="43" font-weight="700" letter-spacing="-1">Вы видите всю работу.</text>
<text x="61" y="267" fill="#4d6757" font-size="20">Задача → план → изменения → проверка.</text>
<text x="61" y="297" fill="#4d6757" font-size="20">С вашими правилами и вашим решением.</text>
