<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Flowcairn — сложная задача, проверенный результат</title>
  <desc id="desc">Цель превращается в требования, работу и проверки каждого результата.</desc>
  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9388ff"/>
      <stop offset="1" stop-color="#73d6c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="22" fill="#18213a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="50" y="40" width="42" height="42" rx="12" fill="#7267ed"/>
    <path d="M61 64l8-9 7 9 7-9" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="69" fill="#f7f9ff" font-size="27" font-weight="700" letter-spacing="-.5">Flowcairn</text>
    <text x="50" y="151" fill="#f7f9ff" font-size="49" font-weight="700" letter-spacing="-1.6">Сложная задача.</text>
    <text x="50" y="209" fill="#8ee3d1" font-size="49" font-weight="700" letter-spacing="-1.6">Проверенный результат.</text>
    <text x="52" y="263" fill="#c4ccdf" font-size="19">От вашей цели до результата, который можно проверить.</text>
    <path d="M789 131h107v-32h109v78h109v-32h96" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="789" cy="131" r="8" fill="#9388ff"/>
    <circle cx="896" cy="99" r="8" fill="#aaa2ff"/>
    <circle cx="1005" cy="177" r="8" fill="#b7cbed"/>
    <circle cx="1114" cy="145" r="8" fill="#8fdccb"/>
    <circle cx="1210" cy="145" r="11" fill="#73d6c0"/>
    <path d="M1205 145l4 4 7-8" fill="none" stroke="#18213a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#d9e0f0" font-size="15">
      <text x="766" y="173">Цель</text>
      <text x="856" y="71">Требования</text>
      <text x="969" y="211">Работа</text>
      <text x="1076" y="116">Проверки</text>
    </g>
