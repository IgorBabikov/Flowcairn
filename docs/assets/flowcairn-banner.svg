<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Flowcairn — большая задача становится управляемой работой</title>
  <desc id="desc">Graph проводит задачу через анализ проекта, план, изменения, проверки и приемку результата.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#edf0fb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" rx="28" fill="url(#surface)"/>
  <rect x="32" y="32" width="1216" height="416" rx="20" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="91" fill="#1d2940" font-size="36" font-weight="700" letter-spacing="-1.1">Flowcairn</text>
    <path d="M72 111H246" fill="none" stroke="#465ee8" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="182" fill="#18243a" font-size="46" font-weight="700" letter-spacing="-1.5">Большая задача</text>
    <text x="72" y="238" fill="#465ee8" font-size="46" font-weight="700" letter-spacing="-1.5">становится управляемой.</text>
    <text x="72" y="286" fill="#59677e" font-size="19">Graph разбивает работу на шаги, связывает зависимости</text>
    <text x="72" y="314" fill="#59677e" font-size="19">и сохраняет доказательства каждого результата.</text>
    <g transform="translate(630 72)">
      <path d="M153 79H201M353 79H401V201H259M259 245V293H507" fill="none" stroke="#aeb8ca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M259 245V293H105" fill="none" stroke="#465ee8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M259 245V293" fill="none" stroke="#465ee8" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
      <rect x="0" y="38" width="153" height="82" rx="14" fill="#f8f9fd" stroke="#cdd5e5" stroke-width="2"/>
      <text x="18" y="70" fill="#64728a" font-size="13" font-weight="700" letter-spacing="1">ЗАДАЧА</text>
      <text x="18" y="100" fill="#1c2940" font-size="18" font-weight="700">Суть задачи</text>
      <rect x="201" y="38" width="152" height="82" rx="14" fill="#f8f9fd" stroke="#cdd5e5" stroke-width="2"/>
      <text x="219" y="70" fill="#64728a" font-size="13" font-weight="700" letter-spacing="1">АНАЛИЗ</text>
      <text x="219" y="100" fill="#1c2940" font-size="18" font-weight="700">Контекст</text>
      <rect x="105" y="163" width="154" height="82" rx="14" fill="#eef0ff" stroke="#465ee8" stroke-width="2"/>
      <circle cx="127" cy="190" r="5" fill="#465ee8"/>
      <text x="143" y="195" fill="#465ee8" font-size="13" font-weight="700" letter-spacing="1">ПЛАН</text>
      <text x="123" y="225" fill="#1c2940" font-size="19" font-weight="700">План готов</text>
      <rect x="401" y="163" width="212" height="82" rx="14" fill="#1d2a42"/>
      <circle cx="423" cy="190" r="5" fill="#75d5cf"/>
      <text x="439" y="195" fill="#9ae7e0" font-size="13" font-weight="700" letter-spacing="1">ВЫПОЛНЕНИЕ</text>
      <text x="419" y="225" fill="#ffffff" font-size="19" font-weight="700">Изменения в коде</text>
      <rect x="0" y="293" width="210" height="70" rx="14" fill="#f8f9fd" stroke="#cdd5e5" stroke-width="2"/>
      <text x="20" y="322" fill="#64728a" font-size="13" font-weight="700" letter-spacing="1">ПРОВЕРКИ</text>
      <text x="20" y="349" fill="#1c2940" font-size="18" font-weight="700">Тесты и ревью</text>
      <rect x="351" y="293" width="156" height="70" rx="14" fill="#eef8f5" stroke="#79bda8" stroke-width="2"/>
      <text x="371" y="322" fill="#41826e" font-size="13" font-weight="700" letter-spacing="1">РЕЗУЛЬТАТ</text>
      <text x="371" y="349" fill="#1c2940" font-size="18" font-weight="700">Приемка вами</text>
