<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc">
  <title id="title">Как Flowcairn проводит задачу через Graph</title>
  <desc id="desc">Пользователь ставит задачу. AI анализирует и предлагает план. Runtime проверяет plan. Человек согласует его. Executor запускает разрешенные этапы. Результат подтверждают checks, review и receipts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a8"/></marker>
  </defs>
  <rect width="1280" height="370" rx="20" fill="#fafbfc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="50" fill="#1f2937" font-size="24" font-weight="700">Задача становится проверяемым Graph</text>
    <text x="50" y="78" fill="#667085" font-size="16">AI предлагает. Runtime проверяет. Человек принимает решение.</text>
    <path d="M206 177H243M425 177H462M644 177H681M863 177H900M1082 177H1119" fill="none" stroke="#aab5c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(48 127)"><rect width="158" height="100" rx="15" fill="#f0efff" stroke="#a89cff"/><text x="18" y="35" fill="#4f4b86" font-size="13" font-weight="700">1 · ВЫ СТАВИТЕ</text><text x="18" y="63" fill="#30305b" font-size="20" font-weight="700">Задачу</text><text x="18" y="84" fill="#62627d" font-size="13">Без JSON и команд</text></g>
    <g transform="translate(243 127)"><rect width="182" height="100" rx="15" fill="#e7f5ee" stroke="#61a983"/><text x="18" y="35" fill="#397252" font-size="13" font-weight="700">2 · AI-УЗЛЫ</text><text x="18" y="63" fill="#24523b" font-size="20" font-weight="700">Анализ и plan</text><text x="18" y="84" fill="#547464" font-size="13">Только нужный контекст</text></g>
    <g transform="translate(462 127)"><rect width="182" height="100" rx="15" fill="#fff4d6" stroke="#c89a3c"/><text x="18" y="35" fill="#99741f" font-size="13" font-weight="700">3 · RUNTIME</text><text x="18" y="63" fill="#5d4516" font-size="20" font-weight="700">Проверяет Graph</text><text x="18" y="84" fill="#806a40" font-size="13">Права, actions, зависимости</text></g>
    <g transform="translate(681 127)"><rect width="182" height="100" rx="15" fill="#fff4d6" stroke="#c89a3c"/><text x="18" y="35" fill="#99741f" font-size="13" font-weight="700">4 · ВЫ</text><text x="18" y="63" fill="#5d4516" font-size="20" font-weight="700">Согласуете plan</text><text x="18" y="84" fill="#806a40" font-size="13">До изменения кода</text></g>
    <g transform="translate(900 127)"><rect width="182" height="100" rx="15" fill="#eef0ff" stroke="#a89cff"/><text x="18" y="35" fill="#625bab" font-size="13" font-weight="700">5 · EXECUTOR</text><text x="18" y="63" fill="#35325f" font-size="20" font-weight="700">Выполняет этапы</text><text x="18" y="84" fill="#68637e" font-size="13">Только когда они готовы</text></g>
    <g transform="translate(1119 127)"><rect width="113" height="100" rx="15" fill="#e0f3cf" stroke="#6da34d"/><text x="15" y="35" fill="#4d8138" font-size="13" font-weight="700">6 · FACTS</text><text x="15" y="63" fill="#28512f" font-size="19" font-weight="700">Evidence</text><text x="15" y="84" fill="#547253" font-size="12">Checks · review</text></g>
    <path d="M991 227V287H335V227" fill="none" stroke="#7f8c9f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="335" y="287" width="656" height="48" rx="12" fill="#ffffff" stroke="#d7dce5"/>
    <text x="663" y="317" text-anchor="middle" fill="#4b5565" font-size="15">Локальная память facts: plan, анализ, receipts, artifacts, hashes, checks и review</text>
  </g>
</svg>
